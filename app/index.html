<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flask Docker App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="tabs" id="tabContainer">
      <button class="tab-btn active" onclick="switchTab('loginView')">Login</button>
      <button class="tab-btn" onclick="switchTab('registerView')">Register</button>
      <button class="tab-btn" id="dashTab" style="display:none;" onclick="switchTab('itemsView')">Dashboard</button>
    </div>

    <div id="loginView" class="view-section active">
      <h2>User Login</h2>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUsername" placeholder="Enter username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password" />
      </div>
      <button class="btn" onclick="loginUser()">Sign In</button>
    </div>

    <div id="registerView" class="view-section">
      <h2>Create Account</h2>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="regUsername" placeholder="Choose username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Choose password" />
      </div>
      <button class="btn" onclick="registerUser()">Register</button>
    </div>

    <div id="itemsView" class="view-section">
      <h2>Item Management</h2>
      <div class="form-group">
        <input type="text" id="itemName" placeholder="New item name" />
      </div>
      <button class="btn" onclick="addItem()">Add Item</button>

      <h3>Your Items</h3>
      <ul id="itemList"></ul>

      <button class="btn logout-btn" onclick="logoutUser()">Log Out</button>
    </div>

    <div id="authMessage" class="message"></div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    function showMessage(text, isError = false) {
      const msgDiv = document.getElementById('authMessage');
      msgDiv.textContent = text;
      msgDiv.className = `message ${isError ? 'error' : 'success'}`;
    }

    function switchTab(viewId) {
      showMessage('');
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (viewId === 'loginView') document.querySelectorAll('.tab-btn')[0].classList.add('active');
      if (viewId === 'registerView') document.querySelectorAll('.tab-btn')[1].classList.add('active');
      if (viewId === 'itemsView') document.getElementById('dashTab').classList.add('active');

      document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    async function registerUser() {
      const username = document.getElementById('regUsername').value;
      const password = document.getElementById('regPassword').value;

      if (!username || !password) return showMessage('Please fill in all fields.', true);

      try {
        const res = await fetch(`${API_BASE}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          showMessage('Account created successfully! Please log in.');
          document.getElementById('regUsername').value = '';
          document.getElementById('regPassword').value = '';
          setTimeout(() => switchTab('loginView'), 1200);
        } else {
          showMessage(data.message || 'Registration failed.', true);
        }
      } catch (err) {
        showMessage('Error connecting to backend.', true);
      }
    }

    async function loginUser() {
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;

      if (!username || !password) return showMessage('Please fill in all fields.', true);

      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.status === 'success') {
          showMessage(`Welcome back, ${data.username}! Redirecting...`);
          document.getElementById('loginUsername').value = '';
          document.getElementById('loginPassword').value = '';
          
          document.getElementById('dashTab').style.display = 'block';
          setTimeout(() => {
            switchTab('itemsView');
            fetchItems();
          }, 800);
        } else {
          showMessage(data.message || 'Invalid username or password.', true);
        }
      } catch (err) {
        showMessage('Error connecting to backend.', true);
      }
    }

    function logoutUser() {
      document.getElementById('dashTab').style.display = 'none';
      switchTab('loginView');
      showMessage('Logged out successfully.');
    }

    async function fetchItems() {
      try {
        const res = await fetch(`${API_BASE}/items`);
        const data = await res.json();
        const list = document.getElementById('itemList');
        list.innerHTML = data.map(item => `<li><strong>${item.name}</strong><br><small>ID: ${item._id}</small></li>`).join('');
      } catch (err) {
        console.error('Failed to fetch items:', err);
      }
    }

    async function addItem() {
      const name = document.getElementById('itemName').value;
      if (!name) return;

      try {
        await fetch(`${API_BASE}/items`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        document.getElementById('itemName').value = '';
        fetchItems();
      } catch (err) {
        console.error('Failed to add item:', err);
      }
    }
  </script>
</body>
</html>
